<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="#1a1a1a" stroke-width="4.5"/>

  <!-- Top arc text path -->
  <defs>
    <path id="topArc" d="M 16,100 A 84,84 0 0,1 184,100"/>
    <path id="bottomArc" d="M 34,118 A 70,70 0 0,0 166,118"/>
  </defs>

  <!-- NORDISKA top -->
  <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="5.5" fill="#1a1a1a">
    <textPath xlink:href="#topArc" startOffset="50%" text-anchor="middle">NORDISKA</textPath>
  </text>

  <!-- KÖK bottom -->
  <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="9" fill="#1a1a1a">
    <textPath xlink:href="#bottomArc" startOffset="50%" text-anchor="middle">KÖK</textPath>
  </text>

  <!-- Outer box -->
  <rect x="50" y="50" width="100" height="100" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Inner box -->
  <rect x="61" y="61" width="78" height="78" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Grid: 2 vertical + 2 horizontal lines dividing inner box into 3x3 -->
  <line x1="87" y1="61" x2="87" y2="139" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="113" y1="61" x2="113" y2="139" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="61" y1="87" x2="139" y2="87" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="61" y1="113" x2="139" y2="113" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- N: left bar -->
  <line x1="70" y1="67" x2="70" y2="133" stroke="#1a1a1a" stroke-width="6" stroke-linecap="square"/>
  <!-- N: diagonal -->
  <line x1="70" y1="67" x2="130" y2="133" stroke="#1a1a1a" stroke-width="6" stroke-linecap="square"/>
  <!-- N: right bar -->
  <line x1="130" y1="67" x2="130" y2="133" stroke="#1a1a1a" stroke-width="6" stroke-linecap="square"/>
</svg>
