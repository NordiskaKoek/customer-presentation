<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nordiska Köket — Quote Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
  <header>
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="56" height="56">
        <circle cx="100" cy="100" r="93" fill="none" stroke="white" stroke-width="4.5"/>
        <defs>
          <path id="topArcH" d="M 16,100 A 84,84 0 0,1 184,100"/>
          <path id="bottomArcH" d="M 34,118 A 70,70 0 0,0 166,118"/>
        </defs>
        <text font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="5.5" fill="white">
          <textPath xlink:href="#topArcH" startOffset="50%" text-anchor="middle">NORDISKA</textPath>
        </text>
        <text font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="9" fill="white">
          <textPath xlink:href="#bottomArcH" startOffset="50%" text-anchor="middle">KÖK</textPath>
        </text>
        <rect x="50" y="50" width="100" height="100" fill="none" stroke="white" stroke-width="3"/>
        <rect x="61" y="61" width="78" height="78" fill="none" stroke="white" stroke-width="1.5"/>
        <line x1="87" y1="61" x2="87" y2="139" stroke="white" stroke-width="1.5"/>
        <line x1="113" y1="61" x2="113" y2="139" stroke="white" stroke-width="1.5"/>
        <line x1="61" y1="87" x2="139" y2="87" stroke="white" stroke-width="1.5"/>
        <line x1="61" y1="113" x2="139" y2="113" stroke="white" stroke-width="1.5"/>
        <line x1="70" y1="67" x2="70" y2="133" stroke="white" stroke-width="6" stroke-linecap="square"/>
        <line x1="70" y1="67" x2="130" y2="133" stroke="white" stroke-width="6" stroke-linecap="square"/>
        <line x1="130" y1="67" x2="130" y2="133" stroke="white" stroke-width="6" stroke-linecap="square"/>
      </svg>
    </div>
    <h1>Quote &amp; Order Confirmation Generator</h1>
  </header>

  <form id="quoteForm" method="POST">
    <!-- Document settings -->
    <section class="card">
      <h2>Document Settings</h2>
      <div class="grid-2">
        <label>
          Document Type
          <select name="doc_type">
            <option value="Quote">Quote</option>
            <option value="Order Confirmation">Order Confirmation</option>
          </select>
        </label>
        <label>
          Document Number
          <input type="text" name="doc_number" value="001" required/>
        </label>
      </div>
    </section>

    <!-- Customer details -->
    <section class="card">
      <h2>Customer Details</h2>
      <div class="grid-2">
        <label>
          Full Name
          <input type="text" name="customer_name" placeholder="Anna Lindström" required/>
        </label>
        <label>
          Email
          <input type="email" name="customer_email" placeholder="anna@example.com"/>
        </label>
        <label>
          Phone
          <input type="tel" name="customer_phone" placeholder="+46 70 000 00 00"/>
        </label>
        <label>
          Project Name
          <input type="text" name="project_name" placeholder="Kitchen renovation — Stockholm"/>
        </label>
        <label class="full">
          Address
          <input type="text" name="customer_address" placeholder="Storgatan 1"/>
        </label>
        <label class="full">
          City &amp; Postal Code
          <input type="text" name="customer_city" placeholder="112 35 Stockholm"/>
        </label>
      </div>
    </section>

    <!-- Products -->
    <section class="card">
      <h2>Products</h2>
      <table id="itemsTable">
        <thead>
          <tr>
            <th>Item</th>
            <th>Description</th>
            <th>Qty</th>
            <th>Unit Price (SEK)</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="itemRows">
          <tr class="item-row">
            <td><input type="text" name="item_name[]" placeholder="Kitchen cabinet set"/></td>
            <td><input type="text" name="item_desc[]" placeholder="White matte finish"/></td>
            <td><input type="number" name="item_qty[]" value="1" min="0" step="0.01" class="qty-input"/></td>
            <td><input type="number" name="item_price[]" value="0" min="0" step="0.01" class="price-input"/></td>
            <td class="row-total">0.00</td>
            <td><button type="button" class="btn-remove" onclick="removeRow(this)">✕</button></td>
          </tr>
        </tbody>
      </table>
      <button type="button" class="btn-secondary" onclick="addRow()">+ Add Item</button>

      <div class="totals">
        <div class="totals-row"><span>Subtotal</span><span id="subtotal">0.00</span></div>
        <div class="totals-row"><span>VAT 25%</span><span id="vat">0.00</span></div>
        <div class="totals-row grand"><span>Total</span><span id="grand">0.00</span></div>
      </div>
    </section>

    <!-- Notes & Signature -->
    <section class="card">
      <h2>Notes &amp; Signature</h2>
      <label>
        Notes / Terms
        <textarea name="notes" rows="4" placeholder="Payment terms: 30 days net. Installation not included."></textarea>
      </label>
    </section>

    <div class="actions">
      <button type="submit" formaction="/preview" class="btn-secondary" target="_blank">Preview</button>
      <button type="submit" formaction="/generate" class="btn-primary">Download PDF</button>
    </div>
  </form>

  <script>
    function addRow() {
      const tbody = document.getElementById('itemRows');
      const row = document.querySelector('.item-row').cloneNode(true);
      row.querySelectorAll('input').forEach(i => {
        if (i.name.includes('qty') || i.name.includes('price')) i.value = i.name.includes('qty') ? 1 : 0;
        else i.value = '';
      });
      row.querySelector('.row-total').textContent = '0.00';
      tbody.appendChild(row);
      attachListeners(row);
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll('.item-row');
      if (rows.length > 1) btn.closest('.item-row').remove();
      updateTotals();
    }

    function attachListeners(row) {
      row.querySelectorAll('.qty-input, .price-input').forEach(input => {
        input.addEventListener('input', () => updateRow(row));
      });
    }

    function updateRow(row) {
      const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
      const price = parseFloat(row.querySelector('.price-input').value) || 0;
      row.querySelector('.row-total').textContent = (qty * price).toFixed(2);
      updateTotals();
    }

    function updateTotals() {
      let subtotal = 0;
      document.querySelectorAll('.item-row').forEach(row => {
        const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
        const price = parseFloat(row.querySelector('.price-input').value) || 0;
        subtotal += qty * price;
      });
      const vat = subtotal * 0.25;
      document.getElementById('subtotal').textContent = subtotal.toFixed(2);
      document.getElementById('vat').textContent = vat.toFixed(2);
      document.getElementById('grand').textContent = (subtotal + vat).toFixed(2);
    }

    // Init listeners
    document.querySelectorAll('.item-row').forEach(attachListeners);
  </script>
</body>
</html>
